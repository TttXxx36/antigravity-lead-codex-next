name: D03 platform smoke
on:
  push:
    branches: [dev/d03]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: d03-platform-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  platform:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev/d03') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dev/d03')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python platform tests
        run: python -m unittest discover -s tests -p test_platform.py -v
      - name: Node platform tests
        run: node --test tests/test-platform.mjs
      - name: Governance ledger
        run: python scripts/check_governance.py docs/EXECUTION_STATUS.json
      - name: Install locked MCP runtime dependencies
        working-directory: plugins/codex-console
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Native Node MCP integration (synthetic only)
        run: node --no-warnings tests/test-mcp-console.mjs
