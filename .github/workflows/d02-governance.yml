name: D02 governance checks
on:
  push:
    branches: [dev/d02]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: d02-governance-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  governance:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev/d02') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dev/d02')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate execution ledger
        run: python scripts/check_governance.py docs/EXECUTION_STATUS.json
      - name: Test governance rejection paths
        run: python -m unittest discover -s tests -p test_governance.py -v
