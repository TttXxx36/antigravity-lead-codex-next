name: Cross-platform candidate regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'dev/**']
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: cumulative-ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  install:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'dev/d'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, windows-11-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Windows 11 desktop runner identity
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $os | Select-Object Caption,Version,BuildNumber,ProductType,OSArchitecture | ConvertTo-Json -Compress
          if ($os.ProductType -ne 1 -or [int]$os.BuildNumber -lt 22000 -or $os.Caption -notmatch 'Windows 11') { throw 'Not Windows 11 desktop' }
          node -p "JSON.stringify({platform:process.platform,arch:process.arch,node:process.version})"
          python -c "import platform,sys; print(platform.machine(),sys.version)"
          git rev-parse HEAD
      - name: Deterministic source RC and isolated rollback regression
        run: python -m unittest discover -s tests -p test_release_rc.py -v
      - name: Paired benchmark evidence regression
        run: node --test tests/test-paired-benchmark.mjs
      - name: Experimental app-server offline protocol and reuse regression
        run: python -m unittest discover -s tests -p test_app_server.py -v
      - name: Risk-driven review and immutable Git evidence regression
        run: python -m unittest discover -s tests -p test_risk_review.py -v
      - name: Deterministic orchestration and restart regression
        run: python -m unittest discover -s tests -p test_orchestrator.py -v
      - name: Persistent scheduler and cleanup safety regression
        run: python -m unittest discover -s tests -p test_scheduler.py -v
      - name: Display cache and delta regression
        run: node --test tests/test-query-cache.mjs
      - name: SQLite state migration and recovery regression
        run: python -m unittest discover -s tests -p test_sqlite_state.py -v
      - name: Bounded streaming and event replay regression
        run: python -m unittest discover -s tests -p test_streaming.py -v
      - name: Durable request and loop guard regression
        run: python -m unittest discover -s tests -p test_request_gate.py -v
      - name: Console durable request regression
        run: node --no-warnings --test tests/test-request-db.mjs
      - name: Usage and budget regression
        run: python -m unittest discover -s tests -p test_budget.py -v
      - name: Task-local context regression
        run: python -m unittest discover -s tests -p test_context.py -v
      - name: Versioned protocol regression
        run: python -m unittest discover -s tests -p test_protocol.py -v
      - name: Native Git porcelain regression
        run: node --test tests/test-git-status.mjs
      - name: Outcome and real owned-process timeout tests
        run: python -m unittest discover -s tests -p test_outcome.py -v
      - name: Node outcome and terminal state tests
        run: node --no-warnings --test tests/test-outcome.mjs
      - name: Execution boundary tests
        run: python -m unittest discover -s tests -p test_execution_policy.py -v
      - name: Dispatch and hook regression
        run: python -m unittest discover -s tests -p test_dispatch.py -v
      - name: Candidate governance regression
        run: python -m unittest discover -s tests -p test_governance.py -v
      - name: State and platform Python regression
        run: python -m unittest discover -s tests -p test_state*.py -v
      - name: Platform Python regression
        run: python -m unittest discover -s tests -p test_platform.py -v
      - name: Platform Node regression
        run: node --test tests/test-platform.mjs
      - name: Offline signed authority receipt regression (no production grant)
        run: node --test tests/test-authority-receipt.mjs
      - name: Governance ledger
        run: python scripts/check_governance.py docs/EXECUTION_STATUS.json
      - name: SBOM repair offline regression
        run: python -m unittest discover -s tests -p test_repair_sbom.py -v
      - name: Native tarball inspection offline regression
        run: python -m unittest discover -s tests -p test_native_tarball_review.py -v
      - name: Dependency notice audit offline regression
        run: python -m unittest discover -s tests -p test_dependency_notices.py -v
      - name: Prepare locked runtime dependencies
        working-directory: plugins/codex-console
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Verify patched Zod runtime version
        working-directory: plugins/codex-console
        run: node -e "if(require('./node_modules/zod/package.json').version !== '4.6.7') process.exit(1)"
      - name: Audit installed locked runtime dependency notices (offline)
        run: python scripts/audit_dependency_notices.py --root plugins/codex-console --phase runtime --out dependency-audit/runtime.json
      - name: Build updated UI source (Linux, no publish)
        if: runner.os == 'Linux'
        working-directory: plugins/codex-console
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:ui
      - name: Audit installed build dependency notices (offline)
        id: build_inventory
        if: runner.os == 'Linux'
        run: python scripts/audit_dependency_notices.py --root plugins/codex-console --phase build --out dependency-audit/build.json
      - name: Collect npm advisory, registry-signature and SBOM evidence (Linux, no fixes)
        id: npm_security
        if: runner.os == 'Linux'
        working-directory: plugins/codex-console
        shell: bash
        run: |
          mkdir -p ../../dependency-audit
          set +e
          npm audit --json --registry=https://registry.npmjs.org > ../../dependency-audit/npm-audit-all.json 2> ../../dependency-audit/npm-audit-all.stderr
          all_status=$?
          npm audit --omit=dev --json --registry=https://registry.npmjs.org > ../../dependency-audit/npm-audit-runtime.json 2> ../../dependency-audit/npm-audit-runtime.stderr
          runtime_status=$?
          npm audit signatures --registry=https://registry.npmjs.org > ../../dependency-audit/npm-audit-signatures.txt 2> ../../dependency-audit/npm-audit-signatures.stderr
          signatures_status=$?
          npm sbom --sbom-format=cyclonedx --registry=https://registry.npmjs.org > ../../dependency-audit/npm-sbom.cdx.json 2> ../../dependency-audit/npm-sbom.stderr
          sbom_status=$?
          printf 'npm_audit_all_exit=%s\nnpm_audit_runtime_exit=%s\nnpm_audit_signatures_exit=%s\nnpm_sbom_exit=%s\n' "$all_status" "$runtime_status" "$signatures_status" "$sbom_status" > ../../dependency-audit/npm-security-summary.txt
          cat ../../dependency-audit/npm-security-summary.txt
      - name: Preserve actual parent license notices (Linux, offline)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp plugins/codex-console/node_modules/esbuild/LICENSE.md dependency-audit/esbuild-LICENSE.md
          cp plugins/codex-console/node_modules/rollup/LICENSE.md dependency-audit/rollup-LICENSE.md
          sha256sum dependency-audit/esbuild-LICENSE.md dependency-audit/rollup-LICENSE.md > dependency-audit/parent-license-sha256.txt
      - name: Verify and repair duplicate leaf SBOM refs (Linux, offline)
        if: runner.os == 'Linux'
        run: python scripts/repair_sbom.py --raw dependency-audit/npm-sbom.cdx.json --lock plugins/codex-console/package-lock.json --out dependency-audit/npm-sbom.derived.cdx.json --report dependency-audit/sbom-repair-report.json
      - name: Verify official CycloneDX schema locally (Linux, no fetch)
        if: runner.os == 'Linux'
        run: node scripts/validate_sbom_schema.mjs
      - name: Inspect locked native binary tarballs from existing npm cache (Linux, offline)
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.build_inventory.conclusion == 'success' }}
        shell: bash
        run: python scripts/native_tarball_review.py --root plugins/codex-console --cache "$(npm config get cache)" --out dependency-audit/native-tarball-report.json
      - name: Verify tracked bundled UI original notices (Linux, no publish)
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.build_inventory.conclusion == 'success' }}
        run: node scripts/collect_ui_notices.mjs
      - name: Require successful security audits (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.npm_security.conclusion == 'success' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("dependency-audit")
          expected = {k+"=0" for k in ("npm_audit_all_exit","npm_audit_runtime_exit","npm_audit_signatures_exit","npm_sbom_exit")}
          assert set((root/"npm-security-summary.txt").read_text().splitlines()) == expected
          for name in ("npm-audit-all.json","npm-audit-runtime.json"):
              report=json.loads((root/name).read_text())
              assert report["auditReportVersion"] == 2 and not report["vulnerabilities"]
              counts=report["metadata"]["vulnerabilities"]
              assert set(counts)=={"info","low","moderate","high","critical","total"} and all(type(v) is int and v==0 for v in counts.values())
          print("PASS: exact npm audit JSON and all four exits")
          PY
      - name: Retain dependency audit metadata
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'dev/d22'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}
          path: dependency-audit/
          retention-days: 7
          if-no-files-found: warn
      - name: Verify tracked UI bundle matches reproducible build
        if: runner.os == 'Linux'
        working-directory: plugins/codex-console
        run: |
          git hash-object dist/app.html
          git diff --exit-code -- dist/app.html
      - name: Native MCP synthetic regression
        run: node --no-warnings tests/test-mcp-console.mjs
      - name: Windows installation lifecycle (mock native executable)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/test-install-windows.ps1
      - name: Unix installer syntax and native MCP smoke
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n scripts/install.sh scripts/doctor.sh plugins/codex-console/bin/run-server.sh
          node --no-warnings scripts/mcp-smoke.mjs plugins/codex-console/server/index.mjs

      - name: Build exact unpublished source RC
        if: github.event_name == 'pull_request' && github.head_ref == 'dev/d22'
        run: python scripts/rc_package.py build --commit ${{ github.event.pull_request.head.sha }} --version v2.0.0-rc.1 --out rc-artifacts
      - name: Retain unpublished RC CI artifacts
        if: github.event_name == 'pull_request' && github.head_ref == 'dev/d22'
        uses: actions/upload-artifact@v4
        with:
          name: source-rc-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}
          path: rc-artifacts/
          retention-days: 7
          if-no-files-found: error
